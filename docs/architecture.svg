<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EcoLoop-AI governed smart-building architecture</title>
  <desc id="desc">EnergyPlus, MCP, LangGraph agents, HVAC Coordinator, deterministic Safety Supervisor, HVAC Control Layer, dashboard, and Facility Manager manual override.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#0b2540"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020914" flood-opacity=".48"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5e85a6"/></marker>
    <style>
      .lane{fill:#091d31;stroke:#214563;stroke-width:1.5}.box{fill:#102b45;stroke-width:2}.title{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#e8f1f8}.sub{font-family:Inter,Arial,sans-serif;fill:#a6b8c7}.line{fill:none;stroke:#5e85a6;stroke-width:2;marker-end:url(#arrow)}.caption{font-family:Inter,Arial,sans-serif;fill:#89a9c2;font-size:12px}.tag{font-family:Inter,Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px}.node{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#e8f1f8;font-size:17px}.nodeSub{font-family:Inter,Arial,sans-serif;fill:#a6b8c7;font-size:12px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="58" class="title" font-size="34">EcoLoop-AI</text>
  <text x="70" y="86" class="sub" font-size="16">Governed smart-building optimisation architecture</text>
  <text x="1530" y="58" text-anchor="end" class="tag" fill="#38bdf8">DIGITAL TWIN • EXPLAINABLE AI • SAFETY GOVERNANCE</text>
  <path d="M70 108H1530" stroke="#24435f"/>

  <rect x="48" y="132" width="1504" height="102" rx="12" class="lane"/><text x="78" y="190" class="tag" fill="#38bdf8" transform="rotate(-90 78 190)">SIMULATION</text>
  <rect x="170" y="154" width="390" height="58" rx="12" class="box" stroke="#38bdf8" filter="url(#shadow)"/><text x="365" y="181" text-anchor="middle" class="node">EnergyPlus Digital Twin</text><text x="365" y="201" text-anchor="middle" class="nodeSub">DOE medium office • thermal and energy simulation</text>
  <rect x="970" y="154" width="390" height="58" rx="12" class="box" stroke="#38bdf8" filter="url(#shadow)"/><text x="1165" y="181" text-anchor="middle" class="node">State Reader</text><text x="1165" y="201" text-anchor="middle" class="nodeSub">Zone temperature • electricity [J] • weather</text>
  <path d="M560 183H970" class="line"/><text x="765" y="171" text-anchor="middle" class="caption">Simulation output</text>

  <rect x="48" y="255" width="1504" height="89" rx="12" class="lane"/><text x="78" y="302" class="tag" fill="#2dd4bf" transform="rotate(-90 78 302)">INTEGRATION</text>
  <rect x="520" y="272" width="560" height="55" rx="12" class="box" stroke="#2dd4bf" filter="url(#shadow)"/><text x="800" y="296" text-anchor="middle" class="node">MCP Server</text><text x="800" y="315" text-anchor="middle" class="nodeSub">State read • audit log • safety-gated control command • simulation run</text>
  <path d="M1165 212V272" class="line"/>

  <rect x="48" y="365" width="1504" height="245" rx="12" class="lane"/><text x="78" y="488" class="tag" fill="#a78bfa" transform="rotate(-90 78 488)">AI ORCHESTRATION</text>
  <rect x="565" y="382" width="470" height="48" rx="12" class="box" stroke="#a78bfa" filter="url(#shadow)"/><text x="800" y="403" text-anchor="middle" class="node">LangGraph Orchestrator</text><text x="800" y="420" text-anchor="middle" class="nodeSub">Validates telemetry before advisory agents execute</text>
  <path d="M800 327V382" class="line"/>
  <g filter="url(#shadow)">
    <rect x="145" y="465" width="225" height="75" rx="12" class="box" stroke="#a78bfa"/><text x="257" y="493" text-anchor="middle" class="node">Comfort Agent</text><text x="257" y="515" text-anchor="middle" class="nodeSub">Thermal comfort target</text>
    <rect x="410" y="465" width="225" height="75" rx="12" class="box" stroke="#a78bfa"/><text x="522" y="493" text-anchor="middle" class="node">Energy Agent</text><text x="522" y="515" text-anchor="middle" class="nodeSub">Tariff-aware strategy</text>
    <rect x="675" y="465" width="225" height="75" rx="12" class="box" stroke="#a78bfa"/><text x="787" y="493" text-anchor="middle" class="node">Weather Forecast Agent</text><text x="787" y="515" text-anchor="middle" class="nodeSub">Outdoor conditions</text>
    <rect x="940" y="465" width="225" height="75" rx="12" class="box" stroke="#a78bfa"/><text x="1052" y="493" text-anchor="middle" class="node">Carbon Impact Agent</text><text x="1052" y="515" text-anchor="middle" class="nodeSub">Estimated CO₂ impact</text>
    <rect x="1205" y="465" width="225" height="75" rx="12" class="box" stroke="#a78bfa"/><text x="1317" y="493" text-anchor="middle" class="node">Occupancy Agent</text><text x="1317" y="515" text-anchor="middle" class="nodeSub">Pre-conditioning forecast</text>
  </g>
  <path d="M800 430V448H257V465M800 448H522V465M800 430V465M800 448H1052V465M800 448H1317V465" class="line"/>

  <rect x="48" y="632" width="1504" height="142" rx="12" class="lane"/><text x="78" y="703" class="tag" fill="#f59e0b" transform="rotate(-90 78 703)">CONTROL GOVERNANCE</text>
  <rect x="190" y="652" width="340" height="55" rx="12" class="box" stroke="#f59e0b" filter="url(#shadow)"/><text x="360" y="676" text-anchor="middle" class="node">HVAC Coordinator</text><text x="360" y="695" text-anchor="middle" class="nodeSub">Explains selection across agents</text>
  <rect x="630" y="652" width="340" height="55" rx="12" class="box" stroke="#34d399" fill="#0b2b32" filter="url(#shadow)"/><text x="800" y="676" text-anchor="middle" class="node">Safety Supervisor</text><text x="800" y="695" text-anchor="middle" class="nodeSub">Deterministic validity • bounds • rate limit • audit</text>
  <rect x="1070" y="652" width="340" height="55" rx="12" class="box" stroke="#f59e0b" filter="url(#shadow)"/><text x="1240" y="676" text-anchor="middle" class="node">HVAC Control Layer</text><text x="1240" y="695" text-anchor="middle" class="nodeSub">Applies only safety-approved setpoint</text>
  <path d="M800 540V622H360V652M800 622H800V652M800 622H1240V652" class="line"/>
  <path d="M530 680H630" class="line"/><path d="M970 680H1070" class="line"/><text x="1018" y="666" text-anchor="middle" class="caption">Approved value only</text>
  <path d="M1240 652V130H365V154" class="line"/><text x="1285" y="385" class="caption">Setpoint + next simulation</text>

  <rect x="48" y="795" width="1504" height="76" rx="12" class="lane"/><text x="78" y="833" class="tag" fill="#f472b6" transform="rotate(-90 78 833)">OPERATIONS</text>
  <rect x="260" y="808" width="300" height="48" rx="12" class="box" stroke="#f472b6" filter="url(#shadow)"/><text x="410" y="829" text-anchor="middle" class="node">Operations Dashboard</text><text x="410" y="846" text-anchor="middle" class="nodeSub">Energy • comfort • explainability • monitoring</text>
  <rect x="650" y="808" width="250" height="48" rx="12" class="box" stroke="#f472b6" filter="url(#shadow)"/><text x="775" y="829" text-anchor="middle" class="node">Facility Manager</text><text x="775" y="846" text-anchor="middle" class="nodeSub">Accept AI or reasoned override</text>
  <rect x="990" y="808" width="250" height="48" rx="12" class="box" stroke="#f472b6" filter="url(#shadow)"/><text x="1115" y="829" text-anchor="middle" class="node">Manual Override</text><text x="1115" y="846" text-anchor="middle" class="nodeSub">Request only; never bypasses safety</text>
  <path d="M560 832H650M900 832H990" class="line"/>
  <path d="M1115 808V735Q1115 720 1080 720H800V707" class="line"/><text x="1160" y="758" class="caption">Reasoned request</text>
  <path d="M410 808V748Q410 730 620 730H800V707" class="line"/><text x="505" y="751" class="caption">Audit visibility</text>
</svg>
